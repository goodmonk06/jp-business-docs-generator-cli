version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: bizdoc-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bizdoc
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache (optional)
  redis:
    image: redis:7-alpine
    container_name: bizdoc-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Main application
  bizdoc:
    build:
      context: .
      dockerfile: Dockerfile
    image: jp-business-docs-generator-cli:latest
    container_name: bizdoc-cli
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/bizdoc?schema=public
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
      - LOG_LEVEL=info
    volumes:
      - ./output:/app/output
      - ./templates:/app/templates:ro
    command: list
    profiles:
      - manual

  # Example service for generating a loan proposal
  generate-loan-proposal:
    build:
      context: .
      dockerfile: Dockerfile
    image: jp-business-docs-generator-cli:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/bizdoc?schema=public
      - NODE_ENV=production
    volumes:
      - ./output:/app/output
      - ./templates:/app/templates:ro
    command: >
      generate loan-proposal
      --company "サンプル株式会社"
      --amount 10000000
      --purpose "新規事業資金"
      --business_type "ソフトウェア開発"
      --output /app/output/loan-proposal-sample.md
    profiles:
      - demo

volumes:
  postgres_data:
  redis_data:
